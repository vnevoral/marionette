root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["make dev-config"]
cmd = "go build -o ./tmp/marionette ./cmd/marionette"
bin = "tmp/marionette"
full_bin = "MARIONETTE_ADDR=:8080 MARIONETTE_CONFIG=./.dev/marionette.json MARIONETTE_CONTROL_SOCKET=./.dev/marionette.sock ./tmp/marionette"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", "web", "internal/webui/dist"]
delay = 200

[log]
time = false
