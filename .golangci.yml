# golangci-lint configuration (v2.14). `make lint` is the single entry point.
version: "2"

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            # Only require documentation of exported names, not
            # stutter-free names (settled in block 0034).
            - "disableStutteringCheck"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: marionette
