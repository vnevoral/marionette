# golangci-lint configuration (v1.61). `make lint` is the single entry point.
run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - gofumpt
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

linters-settings:
  gofumpt:
    module-path: marionette
  revive:
    rules:
      - name: exported
        arguments:
          # Naming of existing exported types is revised in block 0034; until
          # then only require documentation, not stutter-free names.
          - "disableStutteringCheck"

issues:
  exclude-use-default: false
