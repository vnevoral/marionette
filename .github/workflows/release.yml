name: Release

# A pushed vMAJOR.MINOR.PATCH tag (created by the project owner) becomes a
# GitHub Release with the linux/arm64 archive and its .sha256 (block 0057).
# The release is published only after the full CI workflow passes; the tag
# rules themselves live in deploy/release_version.sh, which also rejects
# tags such as v1.2.3-rc1 that the filter below lets through.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# GitHub has started two runs for one tag push (v1.2.4); runs for the same
# tag publish one after another and deploy/publish_release.sh skips a
# release that is already published (block 0069).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag without docs/releases/<tag>.md fails here, before CI and the build
  # (block 0077).
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bash deploy/publish_release.sh --check-notes "$TAG"

  ci:
    needs: notes
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The latest patch release, not the one cached on the runner, so
          # builds get standard library security fixes (block 0066).
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make release-arm64
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash deploy/publish_release.sh "$TAG"
