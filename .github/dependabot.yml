version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Major upgrades of core UI dependencies require an ADR (ADR-0003,
      # ADR-0014); a new major of reka-ui or @lucide/vue is also checked
      # for a licence change.
      - dependency-name: reka-ui
        update-types: ["version-update:semver-major"]
      - dependency-name: "@lucide/vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not supported by typescript-eslint and vue-tsc yet;
      # adopt a new major only after a compatibility check (ci-cd.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
