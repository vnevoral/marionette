version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Major upgrades of core UI dependencies require an ADR (ADR-0003,
      # ADR-0010: PrimeVue 5 changed its licence, the project stays on v4).
      - dependency-name: primevue
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/themes"
        update-types: ["version-update:semver-major"]
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not supported by typescript-eslint and vue-tsc yet;
      # adopt a new major only after a compatibility check (ci-cd.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
